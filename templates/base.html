<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escala · Residência</title><style>body{margin:0;background:#f4f7fb;color:#182b42;font:16px system-ui}header{background:#153a54;color:white;padding:22px 6%;display:flex;align-items:center;justify-content:space-between}main{max-width:1100px;margin:32px auto;padding:0 20px}section{background:white;padding:24px;border-radius:14px;margin:24px 0;box-shadow:0 3px 16px #13283c08}h1{font-size:28px}h2{font-size:21px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:14px 8px;border-bottom:1px solid #e7edf2}button{background:#087f82;color:white;border:0;border-radius:7px;padding:10px 16px;cursor:pointer}select,input{padding:10px;border:1px solid #c7d4de;border-radius:6px;max-width:100%;margin:5px}label{display:block;margin:12px 0}a{color:#087f82}.message{background:#e0f1ef;padding:14px;border-radius:8px}.muted{color:#62758a}form.inline{display:inline}header form button{background:#28546e}.scroll{overflow-x:auto}</style></head><body><header><strong>▦ Escala <small> / Residência</small></strong>{% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}{{ user.get_full_name|default:user.username }} <button>Sair</button></form>{% endif %}</header><main>{% for message in messages %}<p class="message" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
