# Include inside the existing HTTPS server block for the application.
# Keep bearer links out of the reverse proxy's access/error logs.
location ~ ^/(?:calendario/assinatura|ativar)/ {
    access_log off;
    error_log /dev/null;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
}
