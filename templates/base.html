<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escala · Residência</title>
<style>
:root{--ink:#193047;--muted:#64768a;--teal:#087f82;--line:#dfe8ee;--bg:#f4f7fa}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}header{background:#12384b;color:white;padding:17px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px}header strong{font-size:20px;letter-spacing:-.5px}header small{font-size:13px;font-weight:400;opacity:.7}header form{font-size:13px}header button{background:#285369;margin-left:10px}main{max-width:1360px;margin:36px auto;padding:0 24px}h1{font-size:34px;letter-spacing:-1px;margin:6px 0}h2{font-size:21px;margin:0 0 15px}h3{font-size:14px}p{margin:10px 0}section{background:white;border:1px solid var(--line);padding:24px;border-radius:16px;margin:22px 0;box-shadow:0 4px 16px #17304804}.hero,.section-head{display:flex;justify-content:space-between;align-items:center;gap:18px}.eyebrow{font-size:11px;letter-spacing:1.6px;font-weight:750;color:var(--teal)}.muted{color:var(--muted)}a{color:var(--teal);text-underline-offset:3px}button,.button{display:inline-block;background:var(--teal);color:white;border:1px solid transparent;border-radius:8px;padding:10px 16px;font:600 13px system-ui;text-decoration:none;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:white;border-color:var(--line);color:var(--ink)}button:hover:not(:disabled),.button:hover{filter:brightness(.95)}input,select{padding:10px 12px;border:1px solid #c9d6df;border-radius:8px;background:white;color:var(--ink);font:inherit;max-width:100%}select{display:block;width:min(100%,650px);margin-top:6px}input:focus,select:focus{outline:2px solid #49b4b7;outline-offset:2px}label{display:block;margin:14px 0;font-size:13px;font-weight:600}input[type=checkbox]{margin-right:8px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:13px 10px;border-bottom:1px solid #e7edf2}th{color:var(--muted);font-size:11px;letter-spacing:.5px;background:#f8fafc}td{vertical-align:top}.scroll{overflow-x:auto}.inline{display:inline}.message,.notice{padding:15px 18px;border-radius:10px;margin:16px 0;background:#e8f4f2;border:1px solid #c9e5e0}.notice{background:#fff8e9;border-color:#efdeb7;color:#715323}.pills{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}.pills a{padding:9px 15px;text-decoration:none;border-radius:24px;color:var(--muted);background:white;border:1px solid var(--line);font-size:13px;font-weight:600}.pills a.active{background:var(--ink);color:white;border-color:var(--ink)}.week-filter{display:flex;align-items:end;flex-wrap:wrap;gap:14px;margin-bottom:20px}.week-filter label{margin:0}.week-filter input{display:block;margin-top:6px}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:10px;overflow-x:auto;padding-bottom:10px}.day{background:#f7f9fc;border:1px solid #e8edf3;border-radius:11px;min-height:190px;padding:10px}.day-label{color:var(--muted);font-size:11px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.day-label strong{font-size:21px;color:var(--ink)}.shift-card{background:#fff;border:1px solid var(--line);border-left:3px solid #9baebf;border-radius:8px;padding:10px;margin:8px 0}.shift-card.own{border-left-color:var(--teal);background:#effaf8}.shift-card h3{font-size:12px;line-height:1.45;margin:7px 0;overflow-wrap:anywhere}.shift-card p{font-size:11px;color:var(--muted)}.source-link{font-size:10px}.shift-card.pending{border-left-color:#d5a34a;background:#fffbef}.shift-time{font-size:11px;font-weight:750;color:var(--teal)}.empty-day{font-size:11px;color:#91a0af;margin-top:20px}.badge{display:inline-block;font-size:10px;padding:3px 6px;border-radius:5px;background:#d7eee6;color:#17654a}.small{padding:6px 9px;font-size:10px;margin-top:9px}details{border:1px solid var(--line);background:white;border-radius:12px;margin:16px 0;padding:16px 20px}summary{cursor:pointer;font-weight:650;font-size:14px}details>section{border:0;box-shadow:none;padding:10px 0;margin:15px 0 0}.account-link{border-color:#beddda;background:#f2fbf9}.account-link p{font-size:13px}.reference{background:#fafbfc}article hr{border:0;border-top:1px solid var(--line);margin:20px 0}@media(max-width:700px){main{padding:0 14px;margin-top:22px}section{padding:17px}.hero,.section-head{align-items:flex-start;flex-direction:column}h1{font-size:28px}header small{display:none}.week-grid{grid-template-columns:repeat(7,155px)}.hero .button{font-size:12px}}
</style></head><body><header><strong>▦ Escala <small> / Residência</small></strong>{% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}{{ user.get_full_name|default:user.username }} <button>Sair</button></form>{% endif %}</header><main>{% for message in messages %}<p class="message" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
